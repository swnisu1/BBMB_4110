<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BBMB 4110</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f5f8; --panel: #ffffff; --fg: #1b2330; --muted: #5d6b7e; --line: #d9dfe8;
  --accent: #3347c9; --accent-soft: #e6e9fb;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161f; --panel: #1a212d; --fg: #e4e9f1; --muted: #98a5b8; --line: #2e3949;
    --accent: #8d9bff; --accent-soft: #252d52;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161f; --panel: #1a212d; --fg: #e4e9f1; --muted: #98a5b8; --line: #2e3949;
  --accent: #8d9bff; --accent-soft: #252d52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.5; }
main { max-width: 880px; margin: 0 auto; padding: 48px 16px 64px; }
.eyebrow { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .04em; margin: 0 0 8px; }
h1 { font-size: 30px; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
.lede { color: var(--muted); margin: 0 0 32px; max-width: 60ch; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
a.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; text-decoration: none; color: inherit; transition: border-color .15s, transform .15s; }
a.card:hover, a.card:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
.card .t { font-weight: 600; margin: 0 0 4px; color: var(--fg); }
.card .d { font-size: 14px; color: var(--muted); margin: 0; }
.card.intro { background: var(--accent-soft); border-color: transparent; }
.grid.two { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
a.card.big { padding: 28px 28px; border-color: var(--accent); min-height: 150px; }
.card.big .t { font-size: 26px; letter-spacing: -.01em; }
.card.big .d { font-size: 15px; }
footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">BBMB 4110</p>
  <h1>Lab Resources</h1>
  <p class="lede">Protocols for the elective experiments and apps for analyzing your data.</p>

  <div class="grid two">
    <a class="card big" href="lab-protocols.html">
      <p class="t">Lab Protocols</p>
      <p class="d">Handouts for the elective experiments.</p>
    </a>
    <a class="card big" href="data-fitting-apps.html">
      <p class="t">Data Fitting Apps</p>
      <p class="d">Browser tools for fitting kinetics, inhibition, and stability data.</p>
    </a>
  </div>

  <footer>Source on <a href="https://github.com/swnisu1/BBMB_4110">GitHub</a>.</footer>
</main>
</body>
</html>
